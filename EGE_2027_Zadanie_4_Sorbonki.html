<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Контрольная. Задание 4 ЕГЭ. Ударения</title>
<style>
  :root{ --blue:#33608c; --blue-d:#274e75; --line:#94a3b8; --mut:#64748b; --bg:#e8ecf1; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font:15px/1.45 "Segoe UI",Arial,sans-serif;color:#1e293b}
  .wrap{max-width:900px;margin:0 auto;padding:18px}
  .card{background:#f8fafc;border-radius:10px;padding:18px 22px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
  h2{font-size:19px;margin:0}
  .subline{color:var(--mut);font-size:13px;margin-top:3px}
  .gridhead{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #cbd5e1;padding-bottom:10px;margin-bottom:12px}
  .gridhead .no{color:var(--mut);font-size:13px}
  .task{margin:6px 0 14px}
  .task b{color:var(--blue)}
  .prog{display:flex;align-items:center;gap:10px;margin:10px 0 16px;color:var(--mut);font-size:13px}
  .bar{flex:1;height:8px;background:#dbe3ea;border-radius:6px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
  .scene{perspective:1200px;max-width:560px;margin:0 auto}
  .card3d{position:relative;height:230px;transform-style:preserve-3d;transition:transform .6s}
  .card3d.flipped{transform:rotateY(180deg)}
  .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:16px;text-align:center}
  .face.back{transform:rotateY(180deg);background:#eef4fa}
  .ctx{color:var(--mut);font-size:14px}
  .word{font-size:27px;font-weight:800;letter-spacing:.5px}
  .word.backw{font-size:31px;color:var(--blue-d)}
  .vow{cursor:pointer;border-bottom:2px dotted var(--blue);padding:0 2px;border-radius:4px}
  .vow:hover{background:#dbeafe}
  .vow.sel{background:var(--blue);color:#fff;border-bottom-color:var(--blue)}
  .pos{color:var(--mut);font-size:12px}
  .badge{font-weight:700;padding:4px 14px;border-radius:20px;font-size:14px}
  .badge.ok{background:#dcfce7;color:#14532d;border:1px solid #86efac}
  .badge.bad{background:#fee2e2;color:#7f1d1d;border:1px solid #fca5a5}
  .yourans{font-size:13px;color:var(--mut)}
  .cbtns{display:flex;justify-content:center;gap:10px;margin:16px 0 4px}
  .done{max-width:560px;margin:0 auto;text-align:center;padding:40px 20px;border:1px dashed var(--line);border-radius:14px;color:var(--mut)}
  .results{display:none;margin:16px auto 0;max-width:560px;padding:12px 18px;border-radius:8px;background:#eef4fa;border:1px solid #c7d8ea}
  .results .grade{font-size:24px;font-weight:800;color:var(--blue)}
  .results .det{font-size:13px;color:var(--mut);margin-top:4px}
  .msg{margin:10px auto 0;max-width:560px;padding:10px 14px;border-radius:8px;font-weight:600;display:none}
  .msg.ok{display:block;background:#eafbef;color:#14532d;border:1px solid #86efac}
  .msg.warn{display:block;background:#fef2f2;color:#7f1d1d;border:1px solid #fca5a5}
  .toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:18px;border-top:1px solid #cbd5e1;padding-top:14px}
  .fields{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .fields b{margin-right:4px}
  .pill{min-width:44px;padding:8px 6px;text-align:center;border:1px solid #cbd5e1;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
  .pill.on{background:var(--blue);border-color:var(--blue);color:#fff}
  .pill .g{font-weight:800;margin-left:4px}
  .pill.on .g{color:#ffe08a}
  button{font:inherit;padding:9px 16px;border-radius:8px;border:1px solid var(--blue);cursor:pointer}
  .b-fill{background:var(--blue);color:#fff}
  .b-fill:hover:not(:disabled){background:var(--blue-d)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .b-w{background:#fff;border-color:var(--line);color:#1e293b}
  .links button{border:none;background:none;color:var(--blue);text-decoration:underline;padding:4px 6px;font-size:13px}
  #printArea{display:none}
  @media print{
    body{background:#fff}
    #app{display:none}
    #printArea{display:block}
    .pdeck{page-break-after:always}
    .pdeck h3{margin:4px 0 8px;font-size:15px}
    .pdeck li{margin:3px 0;font-size:15px}
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="card">
    <div class="gridhead">
      <div>
        <h2>Контрольная. Задание 4 ЕГЭ. Ударения</h2>
        <div class="subline">Орфоэпические сорбонки по словнику ЕГЭ 2027</div>
      </div>
      <span class="no" id="deckNo"></span>
    </div>
    <div class="task">Нажмите на гласную, на которую, по-вашему, падает ударение, затем переверните карточку и проверьте себя. <b>Каждую колоду можно пройти только один раз.</b></div>
    <div class="prog"><span id="progTxt"></span><span class="bar"><i id="barFill"></i></span></div>
    <div id="stage"></div>
    <div class="results" id="results"></div>
    <div class="msg" id="msg"></div>
    <div class="toolbar">
      <div class="fields"><b>Колода</b><span id="pills" style="display:contents"></span></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="b-w" onclick="resetDeck()">Сбросить</button>
        <span class="links">
          <button onclick="printMode('tasks')">Печать заданий</button>
          <button onclick="printMode('keys')">Печать ключей</button>
        </span>
      </div>
    </div>
  </div>
</div>
<div id="printArea"></div>

<script>
/* ===== Словник ЕГЭ-2027: [контекст, верно, неверно, часть речи] ===== */
const N=[["жилой","квартАл","квАртал"],["важный","докумЕнт","дОкумент"],["кожный","диспансЕр","диспАнсер"],["закрыть","жалюзИ","жАлюзи"],["сидеть в","партЕр","пАртер"],["нотный","пюпИтр","пЮпитр"],["самолётное","шассИ","шАсси"],["опытный","гравЁр","грАвер"],["библиотечный","каталОг","катАлог"],["написать","некролОг","некрОлог"],["вести","диалОг","диАлог"],["актёрский","монолОг","мОнолог"],["городские","аэропОрты","аэропОртЫ"],["пышные","бАнты","бантЫ"],["нет опытных","бухгАлтеров","бухгалтерОв"],["новые","крАны","кранЫ"],["свежие","тОрты","тортЫ"],["тёплые","шАрфы","шарфЫ"],["свежая","свЁкла","свеклА"],["зелёный","щавЕль","щАвель"],["твёрдый","кремЕнь","крЕмень"],["кусочек","кремнЯ","крЕмня"],["болит до","лОктя","локтя"],["не хватает","локтЕй","лОктей"],["длиной до","нОгтя","ногтя"],["стрижка","ногтЕй","нОгтей"],["много хороших","новостЕй","нОвостей"],["горных","мЕстностей","местностЕй"],["две","сирОты","сиротЫ"],["транспортные","срЕдства","средстВА"],["марка","цемЕнт","цЕмент"],["весит","цЕнтнер","центнЕр"],["золотая","цепОчка","цЕпочка"],["опытный","шофЁр","шОфер"],["независимый","экспЕрт","Эксперт"],["пройти","тамОжня","тАможня"],["опытный","столЯр","стОляр"],["школьный","портфЕль","пОртфель"],["новая","тУфля","туфлЯ"],["мраморная","стАтуя","статУя"],["период","Отрочество","отрОчество"],["богатое","придАное","прИданое"],["надеть","пОручни","порУчни"],["весенний","призЫв","прИзыв"],["трубы","созЫв","сОзыв"],["серьёзное","намЕрение","намерЕние"],["на сосне","нарОст","нАрост"],["побороть","недУг","нЕдуг"],["чувствовать","нЕнависть","ненавИсть"],["личная","корЫсть","кОрысть"],["провести","досУг","дОсуг"],["поставить","дефИс","дЕфис"],["поразительная","дешевИзна","дЕшевизна"],["особая","знАчимость","значИмость"],["любое","вероисповЕдание","вЕроисповедание"],["полная","договорЁнность","дОговоренность"],["полное","сосредотОчение","сосредоточЕние"],["городской","водопровОд","вОдопровод"],["новый","газопровОд","гАзопровод"],["подземный","нефтепровОд","нЕфтепровод"],["дворовый","мусоропровОд","мусоропрОвод"],["медный","электропрОвод","электропровОд"],["пройти","киломЕтр","кИлометр"],["пять","кОнусов","конусОв"],["поставить","Иксы","иксЫ"],["древний","еретИк","ерЕтик"],["проложить","лыжнЯ","лЫжня"],["получить","граждАнство","грАжданство"]];
const V=[["телефон","звонИт","звОнит"],["он скоро","позвонИт","позвОнит"],["мама","перезвонИт","перезвОнит"],["менеджер","обзвонИт","обзвОнит"],["свет","включИт","вклЮчит"],["директор","вручИт","врУчит"],["мастер","сверлИт","свЕрлит"],["сердце","щемИт","щЕмит"],["нерв","защемИт","защЕмит"],["рана","кровоточИть","кровотОчить"],["сад","плодоносИть","плОдоносить"],["башня","накренИтся","накрЕнится"],["долго не","дозвонИтся","дозвОнится"],["учитель","повторИт","пОвторит"],["стена","укрепИт","укрЕпит"],["враг","окружИт","окрУжит"],["друг","одолжИт","одОлжит"],["тренер","ободрИт","обОдрит"],["работа","облегчИт","облЕгчит"],["землёй","наделИт","надЕлит"],["ветер","сорИт","сОрит"],["неудача","озлОбить","озлобИть"],["идею","опОшлить","опошлИть"],["о цене","освЕдомиться","осведомИться"],["бумагу","клЕить","клеИть"],["комнату","оклЕить","оклеИть"],["банки","закУпорить","закупОрить"],["бутылку","откУпорить","откупОрить"],["дверь","запломбировАть","запломбИровать"],["зуб","пломбировАть","пломбИровать"],["нагрузку","дозИровать","дозирОвать"],["тихо","кАшлянуть","кашлянУть"],["семечки","щЁлкать","щелкАть"],["воду","чЕрпать","черпАть"],["место","занЯть","зАнять"],["урок","начАть","нАчать"],["задачу","понЯть","пОнять"],["гостей","принЯть","прИнять"],["поезд","прибЫть","прИбыть"],["совет","воспринЯть","воспрИнять"],["дверь","заперЕть","зАпереть"],["она шляпу","снялА","снЯла"],["она книгу","бралА","брАла"],["она друга","ждалА","ждАла"],["она детей","звалА","звАла"],["она часто","лгалА","лгАла"],["она воду","лилА","лИла"],["она цветы","рвалА","рвАла"],["она машину","гналА","гнАла"],["она зонт","взялА","взЯла"],["она долг","отдалА","отдАла"],["она сайт","создалА","сОздала"],["она письмо","послАла","послалА"],["она сахар","клАла","клалА"],["она тихо","крАлась","кралАсь"],["она песню","началА","нАчала"],["она ошибку","понялА","пОняла"],["она ванну","принялА","прИняла"],["она вчера","прибылА","прИбыла"],["она место","занялА","зАняла"],["она новость","воспринялА","воспрИняла"],["ему легко","жилОсь","жИлось"]];
const P=[["край","зАгнутый","загнУтый"],["прут","сОгнутый","согнУтый"],["класс","зАнятый","занЯтый"],["закон","прИнятый","принЯтый"],["труд","нАчатый","начАтый"],["дом","зАпертый","запЕртый"],["картина","снятА","снЯта"],["комната","занятА","зАнята"],["работа","принятА","прИнята"],["планета","заселенА","засЕлена"],["груз","довезЁнный","довЕзенный"],["остров","заселЁнный","засЕленный"],["до роли","низведЁнный","низвЕденный"],["вариант","облегчЁнный","облегчЕнный"],["спортсмен","ободрЁнный","обОдренный"],["слух","обострЁнный","обОстренный"],["свет","отключЁнный","отклЮченный"],["урок","повторЁнный","пОвторенный"],["пирог","поделЁнный","пОделенный"],["зверь","приручЁнный","прирУченный"],["анализ","углублЁнный","углУбленный"],["кот","кормЯщий","кОрмящий"],["рана","кровоточАщий","кровотОчащий"],["богатство","нажИвший","нАживший"],["чай","налИвший","нАливший"],["первым","начАвший","нАчавший"],["все","понЯвший","пОнявший"],["рабочий","нанЯвшийся","нАнявшийся"],["жизнь","прожИвший","прОживший"]];
const D=[["игру","начАв","нАчав"],["дождь","начАвшись","нАчавшись"],["долг","отдАв","Отдав"],["голову","поднЯв","пОдняв"],["шутку","понЯв","пОняв"],["на место","прибЫв","прИбыв"],["проект","создАв","сОздав"],["овощи","закУпорив","закупОрив"]];
const AD=[["прийти","вОвремя","воврЕмя"],["налить","дОверху","довЕрху"],["опустить","дОнизу","донИзу"],["вытереть","дОсуха","досухА"],["очень","донЕльзя","донельзЯ"],["вернуться","зАсветло","засвЕтло"],["выйти","зАтемно","затемнО"],["уехать","надОлго","надолгО"],["заглянуть","ненадОлго","ненадолгО"],["выглядеть","красИвее","красивЕе"]];
const AJ=[["она","вернА","вЕрна","кр. прил."],["она","ловкА","лОвка","кр. прил."],["она","прозорлИва","прозОрлива","кр. прил."],["весомый","знАчимый","значИмый","прил."],["стол","кУхонный","кухОнный","прил."],["узор","мозаИчный","мозАичный","прил."],["склад","оптОвый","Оптовый","прил."],["пирог","слИвовый","сливОвый","прил."],["вид","красИвейший","красивЕйший","прил."]];
const POOL=[];
N.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:"сущ."}));
V.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:"гл."}));
P.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:"прич."}));
D.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:"деепр."}));
AD.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:"нареч."}));
AJ.forEach(x=>POOL.push({p:x[0],c:x[1],b:x[2],pos:x[3]}));

const CARDS=20, DECKS=16, VOW="аеёиоуыэюя";
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const assignCache={};
function assignment(f){
  if(assignCache[f])return assignCache[f];
  const rnd=mulberry32(f+11),arr=[...Array(POOL.length).keys()];
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return assignCache[f]=arr.slice(0,CARDS);
}
const stressIdx=c=>[...c].findIndex(ch=>/[А-ЯЁ]/.test(ch));

let cur=0;
const st=Array.from({length:DECKS},()=>({idx:0,sel:null,flipped:false,answers:[],locked:false,result:null}));

const pills=document.getElementById("pills");
for(let i=0;i<DECKS;i++){const b=document.createElement("span");b.className="pill";b.onclick=()=>{cur=i;render()};pills.appendChild(b);}
function updatePills(){[...pills.children].forEach((el,i)=>{el.classList.toggle("on",i===cur);el.innerHTML=(i+1)+(st[i].result?`<span class="g">${st[i].result.grade}</span>`:"");});}

function wordFront(w){
  return [...w].map((ch,i)=>VOW.includes(ch)?`<span class="vow" data-i="${i}">${ch}</span>`:ch).join("");
}
function render(){
  updatePills();
  const s=st[cur];
  document.getElementById("deckNo").textContent="Колода № "+(cur+1)+(s.locked?" (пройдена)":"");
  document.getElementById("progTxt").textContent=`Карточка ${Math.min(s.idx+1,CARDS)} из ${CARDS}`;
  document.getElementById("barFill").style.width=(s.idx/CARDS*100)+"%";
  const stage=document.getElementById("stage");
  const res=document.getElementById("results");
  if(s.locked){
    stage.innerHTML=`<div class="done">Колода пройдена за одну попытку. Результат сохранён.<br>Выберите другую колоду ниже.</div>`;
    res.style.display="block";
    res.innerHTML=`Баллы: <b>${s.result.pts}</b> из <b>${CARDS}</b> (${s.result.pct}%) &nbsp;·&nbsp; Оценка: <span class="grade">${s.result.grade}</span>
    <div class="det">Верно определено ударение: ${s.result.pts} из ${CARDS}. Шкала: свыше 91% — «5», свыше 75% — «4», свыше 50% — «3», иначе — «2». Одна попытка на колоду.</div>`;
    return;
  }
  res.style.display="none";
  const e=POOL[assignment(cur)[s.idx]], neutral=e.c.toLowerCase();
  stage.innerHTML=`
  <div class="scene"><div class="card3d${s.flipped?" flipped":""}" id="c3d">
    <div class="face front">
      <div class="ctx">${e.p}</div>
      <div class="word">${wordFront(neutral)}</div>
      <div class="pos">${e.pos} · нажмите на гласную</div>
    </div>
    <div class="face back">
      <div class="ctx">${e.p}</div>
      <div class="word backw">${e.c}</div>
      <div id="badge"></div>
      <div class="yourans" id="yourans"></div>
      <div class="pos">${e.pos}</div>
    </div>
  </div></div>
  <div class="cbtns">
    <button class="b-fill" id="flipBtn" ${s.sel===null||s.flipped?"disabled":""}>Перевернуть</button>
    <button class="b-fill" id="nextBtn" ${s.flipped?"":"disabled"}>${s.idx===CARDS-1?"Завершить колоду":"Следующая карточка"}</button>
  </div>`;
  stage.querySelectorAll(".vow").forEach(v=>{
    if(+v.dataset.i===s.sel)v.classList.add("sel");
    v.onclick=()=>{if(s.flipped)return;s.sel=+v.dataset.i;render();};
  });
  document.getElementById("flipBtn").onclick=flip;
  document.getElementById("nextBtn").onclick=next;
  if(s.flipped)paintBack();
}
function flip(){
  const s=st[cur];if(s.sel===null||s.flipped)return;
  s.flipped=true;
  const e=POOL[assignment(cur)[s.idx]];
  s.answers.push(s.sel===stressIdx(e.c));
  document.getElementById("c3d").classList.add("flipped");
  document.getElementById("flipBtn").disabled=true;
  document.getElementById("nextBtn").disabled=false;
  paintBack();
}
function paintBack(){
  const s=st[cur],e=POOL[assignment(cur)[s.idx]],ok=s.answers[s.answers.length-1];
  document.getElementById("badge").innerHTML=ok?`<span class="badge ok">✓ верно</span>`:`<span class="badge bad">✗ неверно</span>`;
  const ya=[...e.c.toLowerCase()];ya[s.sel]=ya[s.sel].toUpperCase();
  document.getElementById("yourans").innerHTML=ok?"":"ваш ответ: "+ya.join("");
}
function next(){
  const s=st[cur];if(!s.flipped)return;
  s.idx++;s.sel=null;s.flipped=false;
  if(s.idx>=CARDS){
    const pts=s.answers.filter(Boolean).length,pct=Math.round(pts*100/CARDS);
    s.result={pts,pct,grade:pct>91?5:pct>75?4:pct>50?3:2};
    s.locked=true;
    render();
    const msg=document.getElementById("msg");
    msg.className=s.result.grade>=4?"msg ok":"msg warn";
    msg.textContent=`Колода № ${cur+1} завершена: ${pts} из ${CARDS} (${pct}%), оценка «${s.result.grade}». Попытка использована.`;
  } else render();
}
function resetDeck(){
  const msg=document.getElementById("msg"),s=st[cur];
  if(s.locked){msg.className="msg warn";msg.textContent="Колода № "+(cur+1)+" уже пройдена: сброс невозможен (одна попытка).";return;}
  st[cur]={idx:0,sel:null,flipped:false,answers:[],locked:false,result:null};
  msg.className="msg";render();
}
function printMode(mode){
  const pa=document.getElementById("printArea");let h="";
  for(let f=0;f<DECKS;f++){
    h+=`<div class="pdeck"><h3>Колода № ${f+1}</h3><ol>`;
    assignment(f).forEach(pi=>{const e=POOL[pi];
      h+=`<li>${e.p} — <b>${mode==="keys"?e.c:e.c.toLowerCase()}</b> <i>(${e.pos})</i></li>`;});
    h+="</ol></div>";
  }
  pa.innerHTML=`<h2>${mode==="keys"?"Ключи. Задание 4 ЕГЭ. Ударения (сорбонки)":"Контрольная. Задание 4 ЕГЭ. Ударения (сорбонки): поставьте ударение"}</h2>`+h;
  setTimeout(()=>window.print(),60);
}
render();
</script>
</body>
</html>
